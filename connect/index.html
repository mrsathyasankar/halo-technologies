<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Connect with Halo Technologies - Call, WhatsApp or Instagram.">
  <title>Connect | Halo Technologies</title>

  <style>
    :root {
      --bg: #050505;
      --card: #0d0d0d;
      --text: #ffffff;
      --muted: #a8a8a8;
      --green: #c6f000;
      --green-dark: #9fc600;
      --border: rgba(198, 240, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(198,240,0,.10), transparent 35%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 260px;
      height: 92px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
    }

    .logo-fallback {
      display: none;
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border: 2px solid var(--green);
      border-radius: 50%;
      color: var(--green);
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .tagline {
      margin: 8px 0 28px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card {
      background: linear-gradient(145deg, #111111, #080808);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 55px rgba(0,0,0,.45);
    }

    .connect-title {
      margin: 0 0 18px;
      font-size: 17px;
      font-weight: 700;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 64px;
      padding: 13px 17px;
      margin: 12px 0;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: #111;
      color: #fff;
      text-decoration: none;
      text-align: left;
      transition: transform .15s ease, background .15s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--green);
      color: #000;
      font-size: 19px;
      font-weight: 900;
    }

    .btn strong {
      display: block;
      font-size: 15px;
      letter-spacing: .4px;
    }

    .btn span {
      display: block;
      margin-top: 3px;
      color: #999;
      font-size: 12px;
    }

    .footer {
      margin-top: 24px;
      color: #777;
      font-size: 12px;
    }

    .footer a {
      color: var(--green);
      text-decoration: none;
    }

    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-2px);
        background: #161616;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <!-- If you have your Halo logo file, replace logo.png with its filename. -->
    <img class="logo" src="halo-logo.png" alt="Halo Technologies"
         onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='flex';">
    <div class="logo-fallback">H</div>

    <h1>HALO TECHNOLOGIES</h1>
    <p class="tagline">Technology • Security • Automation</p>

    <section class="card" aria-label="Contact options">
      <h2 class="connect-title">Let's Connect</h2>

      <!-- 1. CALL -->
      <a class="btn" href="tel:+917594992523">
        <div class="icon">☎</div>
        <div>
          <strong>CALL NOW</strong>
          <span>75949 92523</span>
        </div>
      </a>

      <!-- 2. WHATSAPP -->
      <a class="btn"
         href="https://wa.me/917594992523?text=Hello%20Halo%20Technologies%2C%20I%20would%20like%20to%20know%20more%20about%20your%20services."
         target="_blank"
         rel="noopener">
        <div class="icon">☏</div>
        <div>
          <strong>MESSAGE ON WHATSAPP</strong>
          <span>Start a conversation</span>
        </div>
      </a>

      <!-- 3. INSTAGRAM -->
      <!-- Replace the URL below with your exact Instagram profile URL. -->
      <a class="btn"
         href="https://www.instagram.com/"
         target="_blank"
         rel="noopener">
        <div class="icon">◎</div>
        <div>
          <strong>FOLLOW ON INSTAGRAM</strong>
          <span>See our latest updates</span>
        </div>
      </a>

      <!-- Optional: Save contact -->
      <a class="btn" href="tel:+917594992523">
        <div class="icon">+</div>
        <div>
          <strong>SAVE OUR NUMBER</strong>
          <span>Save Halo Technologies</span>
        </div>
      </a>
    </section>

    <div class="footer">
      <a href="https://haloled.in/">haloled.in</a>
      <br><br>
      Kattappana, Idukki, Kerala
    </div>
  </main>
</body>
</html>
