<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Halo Connect</title>

<style>
:root{
  --bg:#050505;
  --card:#0d0d0d;
  --text:#fff;
  --muted:#999;
  --green:#c8f500;
  --border:rgba(200,245,0,.35)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,rgba(200,245,0,.1),transparent 32%),
    #050505;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 16px 40px
}

.wrap{
  width:100%;
  max-width:430px;
  text-align:center
}

.logo{
  width:min(390px,86vw);
  height:auto;
  max-height:150px;
  object-fit:contain;
  display:block;
  margin:25px auto 34px
}

.connect-card{
  background:linear-gradient(145deg,#111,#080808);
  border:1px solid rgba(255,255,255,.12);
  border-radius:25px;
  padding:24px 18px 28px;
  box-shadow:0 18px 55px rgba(0,0,0,.45)
}

.connect-card h1{
  margin:0 0 22px;
  font-size:22px;
  font-weight:800
}

.connect-btn{
  display:flex;
  align-items:center;
  width:100%;
  min-height:84px;
  margin:12px 0;
  padding:12px 16px;
  border:1px solid var(--border);
  border-radius:17px;
  background:#111;
  color:#fff;
  text-decoration:none;
  text-align:left;
  transition:transform .15s ease,background .15s ease
}

.connect-btn:active{
  transform:scale(.985)
}

@media(hover:hover){
  .connect-btn:hover{
    transform:translateY(-2px);
    background:#151515
  }
}

.icon{
  width:48px;
  height:48px;
  min-width:48px;
  margin-right:17px;
  border-radius:13px;
  background:var(--green);
  color:#000;
  display:grid;
  place-items:center
}

.icon svg{
  width:27px;
  height:27px;
  fill:currentColor;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round
}

.text{
  min-width:0;
  flex:1
}

.title{
  font-size:15px;
  font-weight:800;
  letter-spacing:.3px;
  line-height:1.25
}

.subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  line-height:1.25
}

.arrow{
  color:var(--green);
  font-size:27px;
  line-height:1;
  margin-left:8px
}

footer{
  margin-top:28px;
  text-align:center
}

footer .domain{
  color:var(--green);
  font-size:14px;
  font-weight:700;
  margin-bottom:10px
}

footer .location{
  color:#888;
  font-size:13px
}
</style>
</head>

<body>

<main class="wrap">

<img class="logo"
     src="halo-logo.png"
     alt="Halo Technologies">

<section class="connect-card">

<h1>Let's Connect</h1>

<!-- CALL NOW -->
<a class="connect-btn" href="tel:+917594992523">

<div class="icon">

</svg>
</div>

<div class="text">
<div class="title">CALL NOW</div>
<div class="subtitle">75949 92523</div>
</div>

<div class="arrow">›</div>

</a>

   target="_blank"

<div class="icon">
<svg viewBox="0 0 24 24">

d="M20.5 3.5A11.3 11.3 0 0 0 12.4.2C6.2.2 1.2 5.2 1.2 11.4c0 2 .5 4 1.5 5.7L1 23l6-1.6a11.2 11.2 0 0 0 5.4 1.4h.1c6.2 0 11.2-5 11.2-11.2 0-3-1.2-5.9-3.2-8.1z"/>

<path d="M17.6 13.9c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.7.1-.2 0-.4 0-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.6s1.1 3 1.2 3.2c.2.2 2.1 3.3 5.2 4.6 1.9.8 2.6.9 3.5.8.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.1-1.4-.1-.1-.3-.2-.6-.3z"/>

</svg>
</div>

<div class="text">
<div class="title">MESSAGE ON WHATSAPP</div>
<div class="subtitle">Start a conversation</div>
</div>

<div class="arrow">›</div>

</a>


<!-- INSTAGRAM -->
<a class="connect-btn"
   href="https://www.instagram.com/halo_tech/"
   target="_blank"

<div class="icon">

<svg viewBox="0 0 24 24" fill="none">

<div class="icon">

</section>

haloled.in

Kattappana, Idukki, Kerala
</div>

</footer>

</main>

</body>
</html>
